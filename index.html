<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-4GaFLPtQhaF2YXJbydhDGgQi0X1iBTd29tw86osAM+M=' 'sha256-eLaunzxGEmfKQdj6MSFGTkWBzrRKVjGXedSbMQOWD0U=' 'sha256-aOV+5zoQKMoapnFfwZ2aW8hhbgbxLy0nS4AiH8uKDow='; style-src 'sha256-CQnn1av6OeyXM5Mk5MyHdNe9o5F5FP/k01Wvj7C0dxw=' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; manifest-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>125 St Shuttle</title>
<meta name="description" content="Next departure for Columbia's temporary 125 St shuttle">
<meta name="theme-color" content="#1d4f91">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shuttle">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-thumb phone screen — day switch, giant next-departure card, short departure list, route card; two bottom sheets */
:root{
  --bg:#eef1f5; --card:#ffffff; --fg:#121821; --muted:#667080; --line:#dfe4eb;
  --accent:#1d4f91; --accent-fg:#ffffff; --one:#d82c24; --warn-bg:#fff4d6; --warn-fg:#7a5300; --scrim:rgba(10,14,20,.45);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1117; --card:#171e28; --fg:#eef2f7; --muted:#97a2b2; --line:#283240;
  --accent:#6ea6ee; --accent-fg:#0d1117; --one:#ff6a5f; --warn-bg:#3a2f12; --warn-fg:#f3d48a; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1117; --card:#171e28; --fg:#eef2f7; --muted:#97a2b2; --line:#283240;
  --accent:#6ea6ee; --accent-fg:#0d1117; --one:#ff6a5f; --warn-bg:#3a2f12; --warn-fg:#f3d48a; --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(32px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
p{margin:0}
button{font-family:var(--body);cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font:700 1.3rem/1 var(--display);white-space:nowrap;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.bullet{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--one);color:#fff;font:700 .8rem var(--body);flex:none}
.topr{display:flex;align-items:center;gap:6px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px}
.seg button{border:0;background:none;color:var(--muted);font-weight:600;font-size:.85rem;padding:7px 12px;border-radius:99px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.help{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);font:700 .95rem var(--body);color:var(--accent)}

.note{background:var(--warn-bg);color:var(--warn-fg);border-radius:12px;padding:10px 14px;font-size:.88rem}
.note a{color:inherit;font-weight:700}

.hero{background:var(--accent);color:var(--accent-fg);border-radius:20px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:4px}
.hero .lbl{font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.hero .big{font:700 4.2rem/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.hero .big small{font-size:1.6rem;margin-left:4px}
.hero .big.word{font-size:3rem}
.hero .sub{font-weight:600;font-size:1.05rem;font-variant-numeric:tabular-nums}
.hero .sub2{font-size:.9rem;opacity:.88}
.hero a{color:inherit;font-weight:700}

.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:13px 16px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
#rows .row:first-child{border-top:0}
.row .time{font:700 1.4rem/1 var(--display)}
.row .in{color:var(--muted);font-size:.9rem;font-weight:500;text-align:right}
.row.past{opacity:.5}
.row.daylabel{padding:8px 16px;background:var(--bg);font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.more{width:100%;border:0;border-top:1px solid var(--line);background:none;color:var(--accent);font-weight:700;font-size:.95rem;padding:14px}
.earlier{border-top:0;border-bottom:1px solid var(--line)}

.route{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.why{font-size:.85rem;color:var(--muted)}
.step{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;font-size:.92rem}
.step .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-fg);font:700 .72rem var(--body)}
.step .n.train{background:var(--one);color:#fff}
.step b{font-weight:600}
.step a{color:var(--accent);font-weight:600;font-size:.85rem;text-decoration:none;padding:4px 0}

.foot{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);text-align:center}
.foot a{color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;font-size:.88rem;padding:6px}

/* bottom sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);color:var(--fg);width:100%;max-width:480px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;
  padding:22px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:16px}
@media (min-width:600px){.scrim{align-items:center}.sheet{border-radius:22px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:0}}}
.sheet h2{margin:0;font:700 1.7rem/1.1 var(--display);letter-spacing:.01em;text-wrap:balance}
.sheet h3{margin:0;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tips{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.tips li{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;font-size:.95rem}
.tips .ic{width:28px;height:28px;border-radius:8px;background:var(--bg);display:grid;place-items:center;font:700 .85rem var(--body);color:var(--accent)}
.plat{display:flex;gap:6px;flex-wrap:wrap}
.plat button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:.85rem;font-weight:600;color:var(--muted)}
.plat button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.howto{background:var(--bg);border-radius:14px;padding:12px 14px;font-size:.92rem}
.howto ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.primary{border:0;border-radius:14px;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:1rem;padding:14px;width:100%;text-align:center;text-decoration:none;display:block}
.secondary{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--accent);font-weight:700;font-size:1rem;padding:13px;width:100%}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:var(--bg);color:var(--fg);resize:vertical}
details{font-size:.85rem;color:var(--muted)}
details pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border-radius:10px;padding:10px;margin:8px 0 0;font-size:.75rem;color:var(--fg);max-height:180px;overflow:auto}
.small{font-size:.82rem;color:var(--muted)}
.btnrow{display:flex;flex-direction:column;gap:8px}
.stack{display:flex;flex-direction:column;gap:10px}
.small.strong{font-weight:600;color:var(--fg)}
.langs{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.langs button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 11px;font-size:.8rem;font-weight:600;color:var(--muted)}
.langs button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.sheet .langs{justify-content:flex-start}
.installed{background:var(--bg);border-radius:14px;padding:12px 14px;font-size:.92rem;font-weight:600}
.warn{color:var(--one);font-weight:600}
textarea[aria-invalid="true"]{border-color:var(--one)}
.is-off{opacity:.45}
.tertiary{border:0;background:none;color:var(--accent);font-weight:700;font-size:.95rem;padding:8px}
/* Chinese: PingFang SC on Apple devices, Noto Sans SC elsewhere (loaded only when Chinese is chosen).
   Latin digits keep the condensed display face so times still line up. */
:root:lang(zh-Hans){
  --cjk:"PingFang SC","Noto Sans SC","Noto Sans CJK SC","Hiragino Sans GB","Source Han Sans SC","Microsoft YaHei",sans-serif;
  --display:"Barlow Condensed",var(--cjk);
  --body:"Public Sans",var(--cjk);
}
:lang(zh-Hans) body{line-height:1.6;letter-spacing:.01em}
:lang(zh-Hans) .hero .lbl,:lang(zh-Hans) .sheet h3,:lang(zh-Hans) .row.daylabel{letter-spacing:.12em;text-transform:none;font-weight:500}
:lang(zh-Hans) .brand{font-family:var(--cjk);font-weight:600;font-size:1.2rem;letter-spacing:.02em}
:lang(zh-Hans) .hero .big small{font-family:var(--cjk);font-weight:500;font-size:1.3rem;margin-left:6px}
:lang(zh-Hans) .hero .big.word{font-family:var(--cjk);font-weight:600;font-size:2.4rem;letter-spacing:.02em}
:lang(zh-Hans) .hero .sub{font-weight:500}
:lang(zh-Hans) .sheet h2{font-family:var(--cjk);font-weight:600;font-size:1.5rem;letter-spacing:.02em}
:lang(zh-Hans) .seg button,:lang(zh-Hans) .more,:lang(zh-Hans) .primary,:lang(zh-Hans) .secondary,:lang(zh-Hans) .tertiary,:lang(zh-Hans) .linkbtn{font-weight:500;letter-spacing:.04em}
:lang(zh-Hans) .step b,:lang(zh-Hans) .tips b,:lang(zh-Hans) .howto b{font-weight:600}
.ampm{font-family:var(--body);font-size:.62em;font-weight:500;color:var(--muted);margin-right:3px;vertical-align:.12em}
.hero .ampm{color:inherit;opacity:.8}
</style>

<body>
<div class="wrap" id="app">
  <div class="top">
    <div class="brand"><span class="bullet" aria-hidden="true">1</span><span data-t="appName">125 St Shuttle</span></div>
    <div class="topr">
      <div class="seg" role="group" data-ta="scheduleAria">
        <button id="tab-weekday" type="button" data-key="weekday" data-t="weekday">Weekday</button>
        <button id="tab-saturday" type="button" data-key="saturday" data-t="sat">Sat</button>
      </div>
      <button class="help" id="openHelp" type="button" data-ta="helpAria">?</button>
    </div>
  </div>

  <p class="note" id="note" hidden></p>

  <section class="hero" aria-live="polite">
    <p class="lbl" id="hLbl"></p>
    <p class="big" id="hBig">—</p>
    <p class="sub" id="hSub"></p>
    <p class="sub2" id="hSub2"></p>
  </section>

  <section class="list" id="list">
    <button class="more earlier" id="earlier" type="button" data-t="showEarlier">Show earlier times</button>
    <div id="rows"></div>
    <button class="more" id="more" type="button" data-t="showLater">Show later times</button>
  </section>

  <section class="route" id="route"></section>

  <footer class="foot">
    <button class="linkbtn" id="openReport" type="button" data-t="reportOpen">Something look wrong? Tell Lian</button>
    <div class="langs" role="group" data-ta="language"></div>
    <p id="footText"></p>
  </footer>
</div>

<!-- How to use -->
<div class="scrim" id="helpSheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
    <h2 id="helpTitle" data-t="helpTitle">How to use the shuttle app</h2>
    <div class="langs" role="group" data-ta="language"></div>
    <ul class="tips">
      <li><span class="ic">1</span><span data-th="tip1"></span></li>
      <li><span class="ic">2</span><span data-th="tip2"></span></li>
      <li><span class="ic">3</span><span data-th="tip3"></span></li>
      <li><span class="ic">4</span><span data-th="tip4"></span></li>
    </ul>
    <div class="stack">
      <h3 data-t="saveTitle">Save it to your home screen</h3>
      <p class="installed" id="installedNote" data-t="installedNote" hidden></p>
      <div class="plat" role="group" data-ta="deviceAria">
        <button id="p-ios" type="button" data-p="ios" data-t="iphone">iPhone</button>
        <button id="p-android" type="button" data-p="android" data-t="android">Android</button>
        <button id="p-desktop" type="button" data-p="desktop" data-t="computer">Computer</button>
      </div>
      <div class="howto" id="howto"></div>
    </div>
    <button class="primary" id="closeHelp" type="button" data-t="gotIt">Got it</button>
  </div>
</div>

<!-- Report a problem -->
<div class="scrim" id="reportSheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="reportTitle">
    <h2 id="reportTitle" data-t="reportTitle">Something went wrong?</h2>
    <p class="small" data-t="reportIntro"></p>
    <label for="reportText" class="small strong" data-t="reportLabel">What happened (required)</label>
    <textarea id="reportText" required minlength="5" maxlength="2000" aria-describedby="reportMsg"></textarea>
    <details><summary data-t="reportDetails">Details that get attached</summary><pre id="reportLog"></pre></details>
    <div class="btnrow">
      <button class="primary" id="reportEmail" type="button" data-t="sendEmail">Email Lian</button>
      <button class="secondary" id="reportGithub" type="button" data-t="sendGithub">Report on GitHub</button>
      <button class="tertiary" id="reportCopy" type="button" data-t="copyReport">Copy report</button>
      <p class="small" id="reportMsg" role="status"></p>
    </div>
    <button class="linkbtn" id="closeReport" type="button" data-t="cancel">Cancel</button>
  </div>
</div>

<script>
/* Pure schedule logic. Runs in the browser (inlined by the build) and in Node (tests). */
const ShuttleLogic = (() => {
  const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

  // Current date and time in New York, whatever the device's time zone.
  function nyParts(date) {
    const f = new Intl.DateTimeFormat("en-US", {
      timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit",
      weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23"
    });
    const p = Object.fromEntries(f.formatToParts(date).map(x => [x.type, x.value]));
    return { ymd: `${p.year}-${p.month}-${p.day}`, dow: DOW.indexOf(p.weekday), mins: (+p.hour % 24) * 60 + +p.minute };
  }

  const toMin = hhmm => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; };
  function fmt(hhmm) {
    const [h, m] = hhmm.split(":").map(Number);
    return `${h % 12 || 12}:${String(m).padStart(2, "0")} ${h < 12 ? "AM" : "PM"}`;
  }
  function addDays(ymd, n) {
    const d = new Date(ymd + "T12:00:00Z");
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }
  const dowOf = ymd => new Date(ymd + "T12:00:00Z").getUTCDay();
  function prettyDate(ymd) {
    return new Date(ymd + "T12:00:00Z").toLocaleDateString("en-US", { timeZone: "UTC", weekday: "short", month: "short", day: "numeric" });
  }

  function phaseFor(data, ymd) {
    return data.phases.find(p => p.start <= ymd && ymd <= p.end) || null;
  }
  const lastEnd = data => data.phases.reduce((a, p) => (p.end > a ? p.end : a), "");
  const closureFor = (data, ymd) => data.closures.find(c => c.date === ymd) || null;

  // Which service (if any) runs on a date. Returns {key, service, phase} or {closed} or null.
  function serviceOn(data, ymd, onlyKey) {
    const phase = phaseFor(data, ymd);
    if (!phase) return null;
    const dow = dowOf(ymd);
    for (const [key, s] of Object.entries(phase.services)) {
      if (onlyKey && key !== onlyKey) continue;
      if (s.days.includes(dow) && (!s.start || s.start <= ymd) && (!s.end || ymd <= s.end)) {
        const closed = closureFor(data, ymd);
        if (closed) return { closed, key, service: s, phase };
        return { key, service: s, phase };
      }
    }
    return null;
  }

  // Next day (from ymd, optionally skipping today) when a service actually runs.
  function nextServiceDay(data, ymd, { includeToday = false, onlyKey } = {}) {
    for (let i = includeToday ? 0 : 1; i <= 60; i++) {
      const d = addDays(ymd, i);
      if (d > lastEnd(data)) return null;
      const s = serviceOn(data, d, onlyKey);
      if (s && !s.closed) return { ymd: d, ...s, first: s.service.trips[0][0] };
    }
    return null;
  }

  /*
   * Everything the screen needs for one moment.
   * kind: "live" (a trip is still to come today), "done", "closed", "none" (no service today),
   *       "ended" (past the last phase), "notyet" (before the first phase).
   */
  function status(data, now, viewKey) {
    const t = nyParts(now);
    const out = { now: t, kind: "none" };
    if (t.ymd > lastEnd(data)) return { ...out, kind: "ended", endedOn: lastEnd(data) };
    const today = serviceOn(data, t.ymd, viewKey);
    if (today && today.closed) {
      return { ...out, kind: "closed", reason: today.closed.reason, service: today.service, key: today.key,
        next: nextServiceDay(data, t.ymd, { onlyKey: viewKey }) };
    }
    if (today) {
      const trips = today.service.trips;
      const idx = trips.findIndex(r => toMin(r[0]) >= t.mins);
      if (idx === -1) return { ...out, kind: "done", service: today.service, key: today.key, trips,
        next: nextServiceDay(data, t.ymd, { onlyKey: viewKey }) };
      return { ...out, kind: "live", service: today.service, key: today.key, trips, nextIdx: idx,
        waitMin: toMin(trips[idx][0]) - t.mins };
    }
    const next = nextServiceDay(data, t.ymd, { includeToday: true, onlyKey: viewKey });
    if (!next && !phaseFor(data, t.ymd)) {
      const first = data.phases.reduce((a, p) => (!a || p.start < a ? p.start : a), "");
      if (t.ymd < first) return { ...out, kind: "notyet", next };
    }
    return { ...out, kind: "none", next };
  }

  // Service to show for a tab even when it isn't running today (for the "Weekday"/"Sat" switch).
  function serviceForKey(data, ymd, key) {
    const phase = phaseFor(data, ymd) || data.phases.find(p => p.start > ymd) || data.phases[data.phases.length - 1];
    return phase.services[key] || null;
  }

  // Which tab to open: today's service while trips remain, otherwise the next service that runs.
  function defaultKey(data, now) {
    const t = nyParts(now);
    const s = serviceOn(data, t.ymd);
    if (s && !s.closed && s.service.trips.some(r => toMin(r[0]) >= t.mins)) return s.key;
    const n = nextServiceDay(data, t.ymd);
    if (n) return n.key;
    return s ? s.key : Object.keys(data.phases[data.phases.length - 1].services)[0];
  }

  function minsText(m) {
    if (m <= 0) return "now";
    if (m < 60) return `in ${m} min`;
    return `in ${Math.floor(m / 60)} h ${m % 60} min`;
  }

  return { nyParts, toMin, fmt, addDays, dowOf, prettyDate, phaseFor, serviceOn, nextServiceDay, status,
    serviceForKey, defaultKey, minsText, lastEnd };
})();
if (typeof module !== "undefined") module.exports = ShuttleLogic;

</script>
<script>
/* UI text in English, Spanish and Simplified Chinese, plus translations of the schedule data strings.
 * Strings may contain {name} placeholders. Strings marked with <b> are trusted markup from this file only. */
const ShuttleI18n = (() => {
  const LANGS = { en: { label: "English", locale: "en-US" }, es: { label: "Español", locale: "es-US" }, zh: { label: "中文", locale: "zh-CN" } };

  const T = {
    en: {
      appName: "125 St Shuttle", weekday: "Weekday", sat: "Sat", helpAria: "How to use this app", scheduleAria: "Schedule",
      nextShuttle: "Next shuttle", min: "min", now: "Now",
      fromStop: "{time} from {stop}", arrives: "Arrives {stop} at {time}",

  const l = document.createElement("link");
  l.rel = "stylesheet";
  l.href = "https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap";
  document.head.appendChild(l);
}
const link = (key) => `<a href="${esc(DATA.source)}" target="_blank" rel="noopener noreferrer">${esc(t(key))}</a>`;
const dur = m => m < 60 ? t("durMin", { m }) : t("durHM", { h: Math.floor(m / 60), m: m % 60 });
const until = m => m <= 0 ? t("now") : m < 60 ? t("inMin", { m }) : t("inHM", { h: Math.floor(m / 60), m: m % 60 });

let viewKey, shown = 4, back = 0, last = null;

function render(){
  try {
    const now = new Date();
    const st = L.status(DATA, now, viewKey);
    last = st;
    const svc = st.service || L.serviceForKey(DATA, st.now.ymd, viewKey);
    document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.key === viewKey));

    // Notes: stale data, or the schedule is about to end.
    const notes = [];
    const ageDays = Math.round((Date.parse(st.now.ymd) - Date.parse(DATA.verifiedAt)) / 864e5);
    if (ageDays > 10) notes.push(esc(t("staleNote", { date: dt(DATA.verifiedAt), link: "\u0000" })).replace("\u0000", link("siteName")));
    const phase = L.phaseFor(DATA, st.now.ymd);
    if (phase) {
      const left = Math.round((Date.parse(phase.end) - Date.parse(st.now.ymd)) / 864e5);
      if (left >= 0 && left <= 7) notes.push(esc(t("endingNote", { date: dt(phase.end) })));
    }
    $("note").innerHTML = notes.join("<br>");
    $("note").hidden = !notes.length;

    // Hero
    const hL=$("hLbl"), hB=$("hBig"), hS=$("hSub"), hS2=$("hSub2");
    const withLink = (key, extra) => esc(t(key, Object.assign({ link: "\u0000" }, extra))).replace("\u0000", link("linkName"));
    hB.classList.remove("word");
    if (st.kind === "live") {
      const r = st.trips[st.nextIdx];
      hL.textContent = t("nextShuttle");
      hB.innerHTML = st.waitMin <= 0 ? esc(t("now")) : st.waitMin < 60 ? `${st.waitMin}<small>${esc(t("min"))}</small>` : tmHTML(r[0]);
      hS.textContent = t("fromStop", { time: tm(r[0]), stop: d(svc.from.name) });
      hS2.textContent = t("arrives", { stop: d(svc.to.name), time: tm(r[1]) });
    } else if (st.kind === "ended" || st.kind === "notyet") {
      hL.textContent = st.kind === "ended" ? t("ended") : t("notYet");
      hB.textContent = st.kind === "ended" ? t("endedWord") : t("soon"); hB.classList.add("word");
      hS.textContent = st.kind === "ended" ? t("lastDay", { date: dt(st.endedOn) }) : "";
      hS2.innerHTML = withLink("checkUpdates");
    } else {
      const n = st.next;
      hL.textContent = st.kind === "closed" ? t("closedToday", { reason: d(st.reason) }) :
                       st.kind === "done" ? t("done") :
                       viewKey === "saturday" ? t("runsSat") : t("runsWk");
      if (n) {
        const dayWord = n.ymd === L.addDays(st.now.ymd, 1) ? t("tomorrow") : dt(n.ymd, { month: undefined, day: undefined });
        hB.textContent = `${dayWord} ${tm(n.first)}`; hB.classList.add("word");
        hS.textContent = t("nextOn", { date: dt(n.ymd) });
        hS2.textContent = t("leavesFrom", { stop: d(n.service.from.name) });
      }
      else { hB.textContent = t("none"); hB.classList.add("word"); hS.textContent = t("noMore"); hS2.innerHTML = withLink("check"); }
    }

    // Departure list
    const rows = [];
    let past = [], upcoming = [];
    const row = (cls, hhmm, right) => `<div class="row${cls}"><span class="time">${tmHTML(hhmm)}</span><span class="in">${esc(right)}</span></div>`;
    if (st.kind === "live") {
      past = st.trips.slice(0, st.nextIdx);
      upcoming = st.trips.slice(st.nextIdx + 1);
      const nowM = st.now.mins;
      past.slice(Math.max(0, past.length - back)).forEach(r => rows.push(row(" past", r[0], t("leftAgo", { d: dur(nowM - L.toMin(r[0])) }))));
      upcoming.slice(0, shown).forEach(r => rows.push(row("", r[0], until(L.toMin(r[0]) - nowM))));
      if (!upcoming.length) rows.push(`<div class="row"><span class="in">${esc(t("lastToday"))}</span></div>`);
    } else if (st.kind !== "ended" && st.kind !== "notyet") {
      if (st.kind === "done") { past = st.trips; past.slice(Math.max(0, past.length - back)).forEach(r => rows.push(row(" past", r[0], t("left")))); }
      const n = st.next;
      if (n) {
        upcoming = n.service.trips.slice(1);
        rows.push(`<div class="row daylabel">${esc(dt(n.ymd))}</div>`);
        upcoming.slice(0, shown).forEach(r => rows.push(row("", r[0], t("arrivesShort", { stop: d(n.service.to.name), time: tm(r[1]) }))));
      }
    }
    $("list").hidden = !rows.length;
    $("rows").innerHTML = rows.join("");
    $("earlier").hidden = back >= past.length;
    $("more").hidden = shown >= upcoming.length;

    // Route
    const why = phase ? phase.why[viewKey] : (DATA.phases[0].why || {})[viewKey];
    $("route").innerHTML = (why ? `<p class="why">${esc(d(why))}</p>` : "") + [
      ["1", `<b>${esc(t("boardAt", { stop: d(svc.from.name) }))}</b><br>${esc(d(svc.from.detail))}`, svc.from.address],
      ["2", `<b>${esc(t("getOff", { stop: d(svc.to.name) }))}</b> · ${esc(t("aboutMin", { m: svc.rideMinutes }))}`, svc.to.address],
      ["1", `<b>${esc(d(svc.train))}</b>`, null, true]
    ].map(([n,h,q,train]) => `<div class="step"><span class="n${train?" train":""}">${n}</span><span>${h}</span>${q ? `<a href="${esc(mapUrl(q))}" target="_blank" rel="noopener noreferrer">${esc(t("map"))}</a>` : "<span></span>"}</div>`).join("");
  } catch (e) {
    errors.push("render: " + (e && e.stack || e));
    $("hLbl").textContent = t("errTitle");
    $("hBig").textContent = t("oops"); $("hBig").classList.add("word");
    $("hSub").textContent = t("errSub");
    $("hSub2").innerHTML = esc(t("errCheck", { link: "\u0000" })).replace("\u0000", link("linkName"));
  }
}

/* Static text and language */
function applyLang(){
  loadCjkFont();
  document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;
  document.title = t("appName");
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll("[data-th]").forEach(el => { el.innerHTML = t(el.dataset.th); }); // trusted markup from i18n.js
  document.querySelectorAll("[data-ta]").forEach(el => el.setAttribute("aria-label", t(el.dataset.ta)));
  $("reportText").placeholder = t("reportPlaceholder");
  document.querySelectorAll(".langs").forEach(g => {
    g.innerHTML = Object.entries(I.LANGS).map(([k, v]) => `<button type="button" data-lang="${k}" aria-pressed="${k === lang}" lang="${k === "zh" ? "zh-Hans" : k}">${esc(v.label)}</button>`).join("");
  });
  $("footText").innerHTML = esc(t("footer", { link: "\u0000", date: dt(DATA.verifiedAt) })).replace("\u0000", link("linkName")) + ` · v${esc(APP_VERSION)}`;
  setPlat(plat);
  render();
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-lang]");
  if (b) { lang = b.dataset.lang; store.set("lang", lang); applyLang(); }
});

/* How-to sheet */
function platform(){
  const ua = navigator.userAgent;
  if (/iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) return "ios";
  if (/Android/.test(ua)) return "android";
  return "desktop";
}
const HOW = { ios: "howIos", android: "howAndroid", desktop: "howDesktop" };
let plat = platform();
function setPlat(p){ plat = p; document.querySelectorAll(".plat button").forEach(b => b.setAttribute("aria-pressed", b.dataset.p === p)); $("howto").innerHTML = t(HOW[p]); }
function openSheet(id){ $(id).hidden = false; const f = $(id).querySelector("textarea, .primary, button"); if (f) f.focus(); }
function closeSheet(id){ $(id).hidden = true; }
const installed = window.navigator.standalone || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);

/* Report sheet: a description is required before anything can be sent. */
const MIN_REPORT = 5;
const reportOk = () => $("reportText").value.trim().length >= MIN_REPORT;
function reportDetails(){
  const s = last || {};
  const nextTrip = s.kind === "live" ? L.fmt(s.trips[s.nextIdx][0]) : (s.next ? `${s.next.ymd} ${L.fmt(s.next.first)}` : "-");
  return [
    `App version: ${APP_VERSION}`,
    `Schedule data: ${DATA.dataVersion} (checked ${DATA.verifiedAt})`,
    `Language: ${lang}`,
    `New York time: ${s.now ? s.now.ymd + " " + String(Math.floor(s.now.mins/60)).padStart(2,"0") + ":" + String(s.now.mins%60).padStart(2,"0") : "-"}`,
    `Device time: ${new Date().toString()}`,
    `Tab: ${viewKey}  Status: ${s.kind || "-"}  Next shown: ${nextTrip}`,
    `Screen: ${innerWidth}x${innerHeight}  Installed: ${installed ? "yes" : "no"}`,
    `Browser: ${navigator.userAgent}`,
    `Errors: ${errors.length ? errors.slice(-5).join(" | ") : "none"}`
  ].join("\n");
}
function refreshReport(){
  $("reportLog").textContent = reportDetails();
  const ok = reportOk();
  ["reportEmail", "reportGithub", "reportCopy"].forEach(id => $(id).classList.toggle("is-off", !ok));
  if (ok) { $("reportText").removeAttribute("aria-invalid"); if ($("reportMsg").classList.contains("warn")) { $("reportMsg").textContent = ""; $("reportMsg").classList.remove("warn"); } }
}
function requireText(){
  if (reportOk()) return true;
  $("reportText").setAttribute("aria-invalid", "true");
  $("reportMsg").textContent = t("needText"); $("reportMsg").classList.add("warn");
  $("reportText").focus();
  return false;
}
const reportPlain = () => `${t("whatHappened")}:\n${$("reportText").value.trim().slice(0, 2000)}\n\n${t("details")}:\n${reportDetails()}`;
const reportMarkdown = () => `**What happened**\n${$("reportText").value.trim().slice(0, 2000)}\n\n**Details**\n\`\`\`\n${reportDetails()}\n\`\`\``;
function say(key){ $("reportMsg").classList.remove("warn"); $("reportMsg").textContent = t(key); }

$("reportEmail").addEventListener("click", () => {
  if (!requireText()) return;
  const to = MAIL_PARTS.join("@");
  location.href = `mailto:${to}?subject=${encodeURIComponent(t("emailSubject"))}&body=${encodeURIComponent(reportPlain())}`;
  say("emailOpened");
});
$("reportGithub").addEventListener("click", () => {
  if (!requireText()) return;
  const url = `https://github.com/${REPO}/issues/new?title=${encodeURIComponent("Shuttle app problem")}&body=${encodeURIComponent(reportMarkdown())}`;
  window.open(url, "_blank", "noopener,noreferrer");
});
$("reportCopy").addEventListener("click", async () => {
  if (!requireText()) return;
  try { await navigator.clipboard.writeText(reportPlain()); say("copied"); }
  catch (e) { $("reportLog").closest("details").open = true; const r = document.createRange(); r.selectNodeContents($("reportLog")); getSelection().removeAllRanges(); getSelection().addRange(r); say("copyFallback"); }
});

/* Wire up */
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => { viewKey = b.dataset.key; shown = 4; back = 0; render(); }));
$("earlier").addEventListener("click", () => { back += 4; render(); });
$("more").addEventListener("click", () => { shown += 6; render(); });
$("openHelp").addEventListener("click", () => openSheet("helpSheet"));
$("closeHelp").addEventListener("click", () => { store.set("seenHelp", "1"); closeSheet("helpSheet"); });
document.querySelectorAll(".plat button").forEach(b => b.addEventListener("click", () => setPlat(b.dataset.p)));
$("openReport").addEventListener("click", () => { refreshReport(); openSheet("reportSheet"); });
$("closeReport").addEventListener("click", () => closeSheet("reportSheet"));
$("reportText").addEventListener("input", refreshReport);
document.querySelectorAll(".scrim").forEach(s => s.addEventListener("click", e => { if (e.target === s) { if (s.id === "helpSheet") store.set("seenHelp", "1"); s.hidden = true; } }));
document.addEventListener("keydown", e => { if (e.key === "Escape") document.querySelectorAll(".scrim").forEach(s => s.hidden = true); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

viewKey = L.defaultKey(DATA, new Date());
if (installed) { $("installedNote").hidden = false; plat = platform(); }
applyLang();
setInterval(render, 30000);
if (!store.get("seenHelp")) openSheet("helpSheet");
</script>
</body>
</html>
